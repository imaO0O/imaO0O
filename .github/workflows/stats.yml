name: Stats Card

# Рисует assets/stats.svg своим скриптом и коммитит его в репозиторий.
# Никаких сторонних сервисов — карточка не отвалится вместе с чужим хостингом.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/stats_card.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сгенерировать карточку
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats_card.py "${{ github.repository_owner }}"

      - name: Закоммитить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "📊 обновил карточку статистики"
            git push
          fi
