name: Snake

# Рисует змейку, которая съедает граф контрибьюшенов, и кладёт SVG
# в ветку `output`. README тянет картинки из raw.githubusercontent.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Только при правке самого workflow — иначе змейка перерисовывалась бы
    # после каждого хода в крестиках-ноликах и жгла минуты Actions впустую.
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Сгенерировать змейку
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#a29bfe&color_dots=#12121f,#2d2a55,#4834d4,#6c5ce7,#a29bfe

      - name: Положить в ветку output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
